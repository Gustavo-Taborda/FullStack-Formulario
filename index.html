<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form_Notas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cartao">
        <form id="formulario">
            <h2>Formulário de Notas</h2>
            <p class="subtitulo">Preencha o nome e as 4 notas do aluno.</p>

            <div class="campo">
                <label for="nomeIpt">Nome</label>
                <input type="text" id="nomeIpt" name="nome" required>
            </div>

            <div class="notas-grid">
                <div class="campo">
                    <label for="nota1">Nota 1</label>
                    <input type="number" id="nota1" name="nota1" min="0" max="10" required>
                </div>
                <div class="campo">
                    <label for="nota2">Nota 2</label>
                    <input type="number" id="nota2" name="nota2" min="0" max="10" required>
                </div>
                <div class="campo">
                    <label for="nota3">Nota 3</label>
                    <input type="number" id="nota3" name="nota3" min="0" max="10" required>
                </div>
                <div class="campo">
                    <label for="nota4">Nota 4</label>
                    <input type="number" id="nota4" name="nota4" min="0" max="10" required>
                </div>
            </div>

            <button type="submit">Registrar resultado</button>

            <div class="resultado-caixa" id="resultado"></div>
        </form>
    </div>

    <script src="Script.js"></script>
</body>
</html>
